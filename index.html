<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUHOK SPORT CLUB</title>
    
    <style>
        :root { 
            --dsc-blue: #003366; 
            --dsc-yellow: #ffcc00; 
            --dsc-dark: #050a14; 
        }
        body { 
            background-color: var(--dsc-dark); 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .header { 
            width: 100%; 
            background-color: var(--dsc-blue); 
            padding: 25px 0; 
            text-align: center; 
            border-bottom: 4px solid var(--dsc-yellow); 
        }
        .header h1 { 
            margin: 0; 
            font-size: 26px; 
            color: var(--dsc-yellow); 
            text-transform: uppercase;
        }
        .container { 
            width: 100%; 
            max-width: 450px; 
            padding: 20px; 
        }
        .section-title { 
            text-align: center; 
            font-size: 16px; 
            margin: 20px 0; 
            background: var(--dsc-blue);
            color: var(--dsc-yellow);
            padding: 8px; 
            border-radius: 5px; 
            font-weight: bold;
        }
        .match-card { 
            background: #101826; 
            border-radius: 15px; 
            padding: 20px; 
            margin-bottom: 15px; 
            border: 1px solid #1f2633; 
            text-align: center; 
        }
        .old-match {
            opacity: 0.8;
            border-right: 4px solid #555;
        }
        .match-header { 
            display: flex; 
            justify-content: space-between; 
            font-size: 12px; 
            color: var(--dsc-yellow); 
            margin-bottom: 10px; 
        }
        .teams { font-size: 18px; font-weight: bold; margin: 10px 0; }
        .result {
            font-size: 20px;
            color: var(--dsc-yellow);
            background: rgba(255, 204, 0, 0.1);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 10px;
        }
        .stadium { font-size: 12px; color: #888; }
        
        /* ستایلا دوگمێ */
        .toggle-btn {
            background-color: var(--dsc-blue);
            color: var(--dsc-yellow);
            border: 2px solid var(--dsc-yellow);
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 20px 0;
            font-size: 16px;
        }
        
        /* ڤەشارتنا پشکا یارییێن کەڤن ب شێوەیەکێ دەستپێکی */
        #oldMatchesSection {
            display: none;
            width: 100%;
        }

        .footer { margin-top: 30px; text-align: center; padding-bottom: 40px; font-size: 12px; color: #555; }
    </style>
</head>
<body>

<div class="header">
    <h1>DUHOK SPORT CLUB</h1>
</div>

<div class="container">
    
    <!-- یارییێن نوو -->
    <div class="section-title">UPCOMING MATCHES</div>

    <div class="match-card">
        <div class="match-header">
            <span>2026/05/05 | 5:30 PM</span>
            <span>ROUND (33)</span>
        </div>
        <div class="teams">NAFT MISSAN VS DUHOK</div>
        <div class="stadium">📍 DUHOK STADIUM</div>
    </div>

    <!-- دوگمە بۆ نیشاندانا یارییێن کەڤن -->
    <button class="toggle-btn" onclick="toggleMatches()">VIEW OLD MATCHES / یارییێن کەڤن</button>

    <!-- پشکا ڤەشارتی یا یارییێن کەڤن -->
    <div id="oldMatchesSection">
        <div class="section-title">SEASON 2025-2026</div>

        <div class="match-card old-match">
            <div class="match-header"><span>2026/04/28</span><span>FINISHED</span></div>
            <div class="teams">DUHOK VS ZAKHO</div>
            <div class="result">1 - 0</div>
            <div class="stadium">📍 DUHOK STADIUM</div>
        </div>

        <div class="match-card old-match">
            <div class="match-header"><span>2026/04/20</span><span>FINISHED</span></div>
            <div class="teams">ERBIL VS DUHOK</div>
            <div class="result">0 - 0</div>
            <div class="stadium">📍 ERBIL STADIUM</div>
        </div>
    </div>

    <div class="footer">OFFICIAL PRODUCT</div>
</div>

<script>
    function toggleMatches() {
        var x = document.getElementById("oldMatchesSection");
        if (x.style.display === "none" || x.style.display === "") {
            x.style.display = "block";
        } else {
            x.style.display = "none";
        }
    }
</script>

</body>
</html>
