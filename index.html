<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            background: linear-gradient(180deg, #f1d592, #d4af37);
            padding: 20px 0;
            text-align: center;
            border-bottom: 2px solid #8a6d3b;
        }
        .header h1 { margin: 0; color: #000; font-size: 24px; font-weight: bold; }
        .nav-bar {
            width: 100%;
            background: #0a1428;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-bottom: 2px solid #d4af37;
        }
        .nav-item { color: #d4af37; font-weight: bold; font-size: 14px; }
        .active-tab { border-bottom: 3px solid #d4af37; padding-bottom: 5px; }
        .container { width: 100%; max-width: 450px; padding: 15px; box-sizing: border-box; }
        .section-title { text-align: center; font-size: 16px; margin: 20px 0; font-weight: bold; }
        .match-card {
            border: 1px solid #d4af37;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(10, 20, 40, 0.5);
        }
        .match-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 5px;
        }
        .teams-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 10px 0;
        }
        .team { display: flex; align-items: center; gap: 8px; width: 40%; }
        .team-left { justify-content: flex-end; }
        .team-right { justify-content: flex-start; }
        .team-logo { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #d4af37; background: #fff; }
        .team-name { font-weight: bold; font-size: 14px; }
        .vs-text { font-size: 30px; font-weight: 900; font-style: italic; }
        .stadium { font-size: 12px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header"><h1>DUHOK SPORT CLUB</h1></div>

<div class="nav-bar">
    <span class="nav-item">SQUAD</span>
    <span class="nav-item active-tab">MATCHES</span>
</div>

<div class="container">
    <div class="section-title">UPCOMING MATCHES</div>

    <!-- Match 1 -->
    <div class="match-card">
        <div class="match-header">
            <span>ROUND (33) | 2026/05/05 | TUESDAY</span>
            <span>PM 5:30</span>
        </div>
        <div class="teams-row">
            <div class="team team-left">
                <span class="team-name">DUHOK</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo">
            </div>
            <div class="vs-text">VS</div>
            <div class="team team-right">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="team-logo">
                <span class="team-name">NAFT MISSAN</span>
            </div>
        </div>
        <div class="stadium">DUHOK STADIUM 📍</div>
    </div>

    <!-- Match 2 -->
    <div class="match-card">
        <div class="match-header">
            <span>ROUND (34) | 2026/05/10 | SUNDAY</span>
            <span>PM 5:30</span>
        </div>
        <div class="teams-row">
            <div class="team team-left">
                <span class="team-name">AL QASIM</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/4/41/Al-Qasim_SC_logo.png" class="team-logo">
            </div>
            <div class="vs-text">VS</div>
            <div class="team team-right">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo">
                <span class="team-name">DUHOK</span>
            </div>
        </div>
        <div class="stadium">AL QASIM STADIUM 📍</div>
    </div>
</div>

</body>
</html>
