<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dsc-blue: #003366; --dsc-yellow: #ffcc00; --dsc-dark: #050a14; }
        body { background-color: var(--dsc-dark); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; background-color: var(--dsc-blue); padding: 25px 0; text-align: center; border-bottom: 4px solid var(--dsc-yellow); }
        .header h1 { margin: 0; font-size: 26px; color: var(--dsc-yellow); }
        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        .match-card { background: #101826; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #1f2633; text-align: center; }
        
        /* ئەڤە ئەو پشکەیە کو جهێ لوگۆ و ناڤی دگوهۆڕیت */
        .teams-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-direction: row; }
        .team-box { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: bold; flex-direction: row; } /* ناڤ ل ڕاستێ، لوگۆ ل چەپێ */
        
        .team-logo { width: 40px; height: 40px; border-radius: 50%; background: #fff; padding: 2px; }
        .vs-text { color: var(--dsc-yellow); font-size: 14px; font-weight: bold; margin: 0 10px; }
        .match-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--dsc-yellow); margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="header"><h1>DUHOK SPORT CLUB</h1></div>
    <div class="container">
        <div class="match-card">
            <div class="match-header"><span>2026/05/05</span><span>ROUND (33)</span></div>
            <div class="teams-row">
                <div class="team-box"><span>DUHOK</span><img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo"></div>
                <span class="vs-text">VS</span>
                <div class="team-box"><span>NAFT MISSAN</span><img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="team-logo"></div>
            </div>
        </div>
    </div>
</body>
</html>
