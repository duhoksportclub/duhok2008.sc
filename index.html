<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; width: 100vw; position: fixed; height: 100%;
        }

        .header {
            width: 100%;
            background: linear-gradient(180deg, #f1d592, #d4af37);
            padding: 12px 0; text-align: center; border-bottom: 2px solid #8a6d3b;
        }
        .header h1 { margin: 0; color: #000; font-size: 18px; font-weight: bold; }

        .nav-tabs {
            display: flex; width: 100%; background: #0a1428; border-bottom: 1px solid #d4af37;
        }
        .tab-btn {
            flex: 1; padding: 12px 5px; color: #d4af37; background: none; border: none;
            font-weight: bold; cursor: pointer; font-size: 11px;
        }
        .tab-btn.active { border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.1); }

        .container {
            width: 100%; max-width: 450px; padding: 15px 10px; box-sizing: border-box;
            overflow-y: auto; height: calc(100vh - 110px);
        }

        /* ستایلێ کارتێن ڤیدیۆیێ */
        .video-card {
            background: rgba(10, 20, 40, 0.8);
            border: 1px solid #d4af37;
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .video-placeholder {
            width: 100%;
            height: 200px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-info { padding: 12px; text-align: right; }
        .video-title { font-weight: bold; font-size: 14px; margin-bottom: 5px; display: block; }
        .video-link {
            color: #fff;
            background: #d4af37;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            display: inline-block;
            margin-top: 5px;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>DUHOK SPORT CLUB</h1>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" id="mBtn" onclick="show('matches')">MATCHES</button>
    <button class="tab-btn" id="vBtn" onclick="show('videos')">VIDEOS</button>
    <button class="tab-btn" id="sBtn" onclick="show('squad')">SQUAD</button>
    <button class="tab-btn" id="cBtn" onclick="show('chat')">COMMUNITY</button>
</div>

<div class="container" id="matches-area">
    <div style="border: 1px solid #d4af37; border-radius: 20px; padding: 20px; background: rgba(10, 20, 40, 0.6);">
        <div style="text-align:center; font-size:10px; margin-bottom:10px;">ROUND (33) | 2026/05/05</div>
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" style="width:45px;">
            <span style="font-size:30px; font-weight:900; font-style:italic;">VS</span>
            <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" style="width:45px;">
        </div>
    </div>
</div>

<!-- پشکا ڤیدیۆیان -->
<div class="container hidden" id="videos-area">
    <div class="video-card">
        <div class="video-placeholder">
            <!-- لێرە دشێی کۆدێ ڤیدیۆیێ دانێ (Embed Code) -->
            <span style="color:#555;">VIDEO PLAYER</span>
        </div>
        <div class="video-info">
            <span class="video-title">گۆڵێن یانەیا دۆهۆک دگەل نەفت میسان</span>
            <a href="#" class="video-link">تەماشە بکە 🎬</a>
        </div>
    </div>

    <div class="video-card">
        <div class="video-placeholder">
            <span style="color:#555;">VIDEO PLAYER</span>
        </div>
        <div class="video-info">
            <span class="video-title">ڕاهێنانێن تیپێ ل یاریگەها دهۆک</span>
            <a href="#" class="video-link">لینکێ ڤیدیۆیێ 🔗</a>
        </div>
    </div>
</div>

<div class="container hidden" id="squad-area">
    <div style="text-align:center; padding:50px; opacity:0.5;">COMING SOON...</div>
</div>

<div class="container hidden" id="chat-area">
    <div style="text-align:center; padding:50px; opacity:0.5;">COMMUNITY CHAT</div>
</div>

<script>
    function show(type) {
        const areas = ['matches-area', 'videos-area', 'squad-area', 'chat-area'];
        const btns = ['mBtn', 'vBtn', 'sBtn', 'cBtn'];
        
        areas.forEach(a => document.getElementById(a).classList.add('hidden'));
        btns.forEach(b => document.getElementById(b).classList.remove('active'));

        document.getElementById(type + '-area').classList.remove('hidden');
        document.getElementById(type.charAt(0) + 'Btn').classList.add('active');
    }
</script>

</body>
</html>
