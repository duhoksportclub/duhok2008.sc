<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { 
            --gold: #d4af37; 
            --dark-blue: #050a14;
            --card-bg: #0a1428;
        }
        body { 
            background-color: var(--dark-blue); 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }

        /* Header وەک وێنەی */
        .header { 
            width: 100%; 
            background: linear-gradient(180deg, #f1d592, #d4af37);
            padding: 25px 0; 
            text-align: center;
            border-bottom: 2px solid #8a6d3b;
        }
        .header h1 { margin: 0; color: #000; font-size: 22px; font-weight: bold; }

        .nav-tabs {
            width: 100%;
            background: #0a1428;
            display: flex;
            border-bottom: 2px solid var(--gold);
        }
        .tab { flex: 1; text-align: center; padding: 15px; color: var(--gold); font-weight: bold; }
        .tab.active { border-bottom: 4px solid var(--gold); }

        .container { width: 100%; max-width: 450px; padding: 15px; }
        .section-title { text-align: center; color: var(--gold); font-size: 16px; margin: 15px 0; font-weight: bold; }

        /* کارتا یاریێ ب تەمامی وەک وێنەی */
        .match-card { 
            border: 1px solid var(--gold); 
            border-radius: 20px; 
            padding: 20px; 
            margin-bottom: 20px; 
            background: rgba(10, 20, 40, 0.4);
            text-align: center;
        }

        .match-header-info { 
            font-size: 11px; 
            color: var(--gold); 
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .teams-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 15px 0;
        }

        /* لایێ چەپێ: ناڤ + لوگۆ (وەک وێنەی) */
        .team-left { display: flex; align-items: center; gap: 8px; width: 40%; justify-content: flex-end; }
        /* لایێ ڕاستێ: لوگۆ + ناڤ (وەک وێنەی) */
        .team-right { display: flex; align-items: center; gap: 8px; width: 40%; justify-content: flex-start; }

        .team-name { color: var(--gold); font-weight: bold; font-size: 14px; }
        .team-logo { width: 45px; height: 45px; border-radius: 50%; border: 1px solid var(--gold); background: #fff; padding: 2px; }

        .vs-text { font-size: 30px; font-weight: 900; color: var(--gold); font-style: italic; }
        .stadium-text { font-size: 12px; color: var(--gold); margin-top: 10px; }
    </style>
</head>
<body>

<div class="header"><h1>DUHOK SPORT CLUB</h1></div>

<div class="nav-tabs">
    <div class="tab">SQUAD</div>
    <div class="tab active">MATCHES</div>
</div>

<div class="container">
    <div class="section-title">UPCOMING MATCHES</div>

    <!-- Match 1 -->
    <div class="match-card">
        <div class="match-header-info">
            <span>ROUND (33) | 2026/05/05 | TUESDAY</span>
            <span>PM 5:30</span>
        </div>
        <div class="teams-container">
            <div class="team-left">
                <span class="team-name">DUHOK</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo">
            </div>
            <div class="vs-text">VS</div>
            <div class="team-right">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="team-logo">
                <span class="team-name">NAFT MISSAN</span>
            </div>
        </div>
        <div class="stadium-text">DUHOK STADIUM 📍</div>
    </div>

    <!-- Match 2 (Inverted Logos like image) -->
    <div class="match-card">
        <div class="match-header-info">
            <span>ROUND (34) | 2026/05/10 | SUNDAY</span>
            <span>PM 5:30</span>
        </div>
        <div class="teams-container">
            <div class="team-left">
                <span class="team-name">AL QASIM</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/4/41/Al-Qasim_SC_logo.png" class="team-logo">
            </div>
            <div class="vs-text">VS</div>
            <div class="team-right">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo">
                <span class="team-name">DUHOK</span>
            </div>
        </div>
        <div class="stadium-text">AL QASIM STADIUM 📍</div>
    </div>
</div>

</body>
</html>
