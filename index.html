<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duhok Sport Club</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #11141a;
            --gold: #d4af37;
            --white: #ffffff;
            --gray: #8a8d93;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            padding-bottom: 40px;
        }

        /* Top Header Area */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .score-num {
            font-size: 42px;
            font-weight: 800;
            color: var(--white);
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .club-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--gold);
            max-width: 150px;
            line-height: 1.3;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            border-bottom: 2px solid #1a1f29;
            margin-bottom: 30px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 11px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            opacity: 0.7;
            transition: all 0.3s ease;
        }

        .tab-item.active {
            opacity: 1;
            border-bottom: 2px solid var(--gold);
            background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.05));
        }

        /* Central Container */
        .match-container {
            border: 2px solid var(--gold);
            border-radius: 24px;
            background-color: var(--card-bg);
            padding: 30px 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .round-info {
            font-size: 11px;
            color: var(--gray);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        /* Cleaned Match Section (Only placeholders, matches removed as requested) */
        .empty-zone {
            padding: 40px 0;
            font-size: 14px;
            color: var(--gray);
            font-style: italic;
        }

        /* Bottom Button */
        .tiktok-btn {
            display: block;
            width: 100%;
            border: 2px solid var(--white);
            background-color: transparent;
            color: var(--white);
            text-decoration: none;
            text-align: center;
            padding: 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .tiktok-btn:hover {
            background-color: var(--white);
            color: var(--bg-color);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="wrapper">
        
        <div class="top-header">
            <div class="score-num">93</div>
            <div class="club-title">DUHOK<br>SPORT CLUB</div>
            <div class="score-num">34</div>
        </div>

        <div class="nav-tabs">
            <div class="tab-item">Community</div>
            <div class="tab-item">Squad</div>
            <div class="tab-item">Videos</div>
            <div class="tab-item active">Matches</div>
        </div>

        <div class="match-container">
            <div class="round-info">Duhok SC Hub</div>
            
            <div class="empty-zone">
                Yariyên نوو دێ ل ڤێرێ ل هێنە دانان
            </div>
            
        </div>

        <a href="https://www.tiktok.com/" target="_blank" class="tiktok-btn">
            Follow on TikTok
        </a>

    </div>

</body>
</html>
