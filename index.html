<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUHOK SC - PREMIUM</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-light: #f1d592;
            --dark-blue: #050a14;
            --card-bg: rgba(10, 20, 40, 0.85);
        }
        body { 
            background: linear-gradient(to bottom, #101826, #050a14);
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }
        
        /* Header وەک وێنەی */
        .header { 
            width: 100%; 
            background: linear-gradient(180deg, var(--gold) 0%, #8a6d3b 100%);
            padding: 30px 0; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        .header h1 { 
            margin: 0; 
            font-size: 28px; 
            color: #050a14; 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1px;
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            padding: 15px; 
            box-sizing: border-box;
        }

        .section-title { 
            text-align: center; 
            font-size: 18px; 
            margin: 20px 0; 
            color: var(--gold);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* کارتا یاریێ ب باکگراوندێ یاریگەهێ */
        .match-card { 
            background-image: linear-gradient(rgba(5, 10, 20, 0.8), rgba(5, 10, 20, 0.8)), url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            border-radius: 20px; 
            padding: 25px; 
            margin-bottom: 20px; 
            border: 2px solid var(--gold); 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .match-header { 
            color: var(--gold-light);
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
        }

        .teams-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-around; 
            margin: 20px 0;
        }

        .team-box { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            gap: 10px; 
            width: 40%;
        }

        .team-name {
            font-size: 18px;
            font-weight: bold;
            color: var(--gold);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .team-logo { 
            width: 70px; 
            height: 70px; 
            border-radius: 50%; 
            background: white; 
            padding: 5px;
            border: 3px solid var(--gold);
            box-shadow: 0 0 15px var(--gold);
        }

        .vs-text { 
            font-size: 32px; 
            font-weight: 900; 
            color: var(--gold);
            font-style: italic;
            text-shadow: 0 0 10px var(--gold);
        }

        .stadium { 
            font-size: 14px; 
            color: #ccc; 
            margin-top: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .footer {
            margin-top: auto;
            padding: 30px;
            text-align: center;
            width: 100%;
            background: rgba(0,0,0,0.5);
        }

        .official-tag { color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h1>DUHOK SPORT CLUB</h1>
</div>

<div class="container">
    <div class="section-title">UPCOMING MATCHES</div>

    <!-- MATCH 1: NAFT MISSAN -->
    <div class="match-card">
        <div class="match-header">ROUND (33) | 2026/05/05 | 5:30 PM</div>
        <div class="teams-row">
            <div class="team-box">
                <span class="team-name">DUHOK</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo">
            </div>
            <div class="vs-text">VS</div>
            <div class="team-box">
                <span class="team-name">NAFT MISSAN</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="team-logo">
            </div>
        </div>
        <div class="stadium">📍 DUHOK STADIUM</div>
    </div>

    <!-- MATCH 2: AL QASIM -->
    <div class="match-card">
        <div class="match-header">ROUND (34) | 2026/05/10 | 5:30 PM</div>
        <div class="teams-row">
            <div class="team-box">
                <span class="team-name">DUHOK</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo">
            </div>
            <div class="vs-text">VS</div>
            <div class="team-box">
                <span class="team-name">AL QASIM</span>
                <img src="https://upload.wikimedia.org/wikipedia/en/4/41/Al-Qasim_SC_logo.png" class="team-logo">
            </div>
        </div>
        <div class="stadium">📍 DUHOK STADIUM</div>
    </div>
</div>

<div class="footer">
    <div class="official-tag">OFFICIAL DUHOK SC APP</div>
    <div style="color: #888; font-size: 12px; margin-top: 5px;">TIK: duhok2008.sc</div>
</div>

</body>
</html>
