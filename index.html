<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header */
        .header {
            width: 100%;
            background: linear-gradient(180deg, #f1d592, #d4af37);
            padding: 15px 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            border-bottom: 2px solid #8a6d3b;
        }
        .header img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #d4af37; background: white; }
        .header h1 { margin: 0; color: #000; font-size: 20px; font-weight: bold; }

        .nav-bar {
            width: 100%;
            background: #0a1428;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-bottom: 2px solid #d4af37;
        }

        .container { width: 100%; max-width: 450px; padding: 15px; }

        /* کارتا یاریێ */
        .match-card {
            border: 1px solid #d4af37;
            border-radius: 25px;
            padding: 25px 15px;
            margin-bottom: 20px;
            background: rgba(10, 20, 40, 0.5);
        }

        .match-info-top {
            font-size: 11px;
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }

        .teams-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        /* ستایلێ تیمان: لوگۆ ل کەناری و ناڤ ل ڕەخ VS */
        .team-box { 
            display: flex; 
            align-items: center; 
            width: 45%;
        }

        /* لایێ چەپێ: لوگۆ --- ناڤ (نێزیکی VS) */
        .left-side { 
            flex-direction: row; 
            justify-content: flex-start;
        }

        /* لایێ ڕاستێ: ناڤ (نێزیکی VS) --- لوگۆ */
        .right-side { 
            flex-direction: row-reverse; 
            justify-content: flex-start;
        }

        .logo-img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background: white;
            flex-shrink: 0;
        }

        .name-text {
            font-weight: bold;
            font-size: 14px;
            margin: 0 8px; /* نێزیککرنا ناڤی ژ لوگۆی */
        }

        .vs-text {
            font-size: 34px;
            font-weight: 900;
            font-style: italic;
            color: #d4af37;
        }

        .stadium { text-align: center; margin-top: 15px; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png">
    <h1>DUHOK SPORT CLUB</h1>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_x-vXWv_z3Z6h7iO8yQyE9v1X3Z5f6g7h8i">
</div>

<div class="nav-bar">
    <span style="color:#d4af37; font-weight:bold;">MATCHES</span>
    <span style="color:#d4af37; font-weight:bold;">SQUAD</span>
</div>

<div class="container">
    <div class="match-card">
        <div class="match-info-top">ROUND (33) | 2026/05/05 | PM 5:30</div>
        
        <div class="teams-container">
            <!-- تیمێ چەپێ: لوگۆ ل کەناری، ناڤ ل ڕەخ VS -->
            <div class="team-box left-side">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="logo-img">
                <span class="name-text">NAFT MISSAN</span>
            </div>

            <div class="vs-text">VS</div>

            <!-- تیمێ ڕاستێ: ناڤ ل ڕەخ VS، لوگۆ ل کەناری -->
            <div class="team-box right-side">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="logo-img">
                <span class="name-text">DUHOK</span>
            </div>
        </div>

        <div class="stadium">DUHOK STADIUM 📍</div>
    </div>
</div>

</body>
</html>
