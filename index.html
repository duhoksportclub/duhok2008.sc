<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUHOK SPORT CLUB</title>
    
    <style>
        :root { 
            --dsc-blue: #003366; 
            --dsc-yellow: #ffcc00; 
            --dsc-dark: #050a14; 
        }
        body { 
            background-color: var(--dsc-dark); 
            color: white; 
            font-family: sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        .header { 
            width: 100%; 
            background-color: var(--dsc-blue); 
            padding: 30px 0; 
            text-align: center; 
            border-bottom: 4px solid var(--dsc-yellow); 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .header h1 { 
            margin: 0; 
            font-size: 28px; 
            color: var(--dsc-yellow); 
            letter-spacing: 2px; 
            text-transform: uppercase;
        }
        .container { 
            width: 100%; 
            max-width: 450px; 
            padding: 40px 20px; 
            text-align: center;
        }
        .welcome-msg {
            font-size: 20px;
            color: var(--dsc-yellow);
            border: 1px solid var(--dsc-yellow);
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 204, 0, 0.05);
        }
        .footer { 
            margin-top: auto; 
            text-align: center; 
            padding-bottom: 30px; 
        }
        .official-tag { 
            color: var(--dsc-yellow); 
            font-size: 14px; 
            font-weight: bold; 
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>DUHOK SPORT CLUB</h1>
</div>

<div class="container">
    <div class="welcome-msg">
        ب خێر بێی بۆ سایتێ فەرمی یێ هەواڵێن یانەیا دهۆکێ
        <br><br>
        چاوەڕێی یارییێن نوو بن...
    </div>
</div>

<div class="footer">
    <div class="official-tag">OFFICIAL PLATFORM</div>
</div>

</body>
</html>
