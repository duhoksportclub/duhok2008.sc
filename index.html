<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --dsc-blue: #003366; --dsc-yellow: #ffcc00; --dsc-dark: #050a14; }
        body { background-color: var(--dsc-dark); color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        
        .header { width: 100%; background-color: var(--dsc-blue); padding: 20px 0; text-align: center; border-bottom: 4px solid var(--dsc-yellow); }
        .header h2 { margin: 0; color: var(--dsc-yellow); font-size: 22px; font-weight: bold; }

        .container { width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box; }
        
        .section-title { background: #0a111f; color: var(--dsc-yellow); text-align: center; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; border: 1px solid #1f2633; font-size: 14px; letter-spacing: 1px; }
        
        .match-card { background: #101826; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #1f2633; }
        .match-header { display: flex; justify-content: space-between; font-size: 11px; color: var(--dsc-yellow); margin-bottom: 15px; font-weight: bold; }
        
        .teams-row { display: flex; align-items: center; justify-content: center; gap: 10px; }
        .vs-text { color: var(--dsc-yellow); font-weight: bold; font-size: 16px; width: 40px; text-align: center; }
        .team-box { display: flex; align-items: center; flex: 1; gap: 12px; }
        .team-box.left { justify-content: flex-end; }
        .team-box.right { justify-content: flex-start; flex-direction: row-reverse; }
        .team-box span { font-weight: bold; font-size: 14px; }
        .team-logo { width: 45px; height: 45px; border-radius: 50%; background: #fff; padding: 2px; }
        
        .stadium-info { font-size: 11px; color: #888; margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="header">
    <h2>DUHOK SPORT CLUB</h2>
</div>

<div class="container">
    <div class="section-title">UPCOMING MATCHES</div>
    
    <!-- Match 1 -->
    <div class="match-card">
        <div class="match-header"><span>ROUND (33)</span><span>2026/05/05</span></div>
        <div class="teams-row">
            <div class="team-box left"><span>NAFT MISSAN</span><img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="team-logo"></div>
            <div class="vs-text">VS</div>
            <div class="team-box right"><span>DUHOK</span><img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo"></div>
        </div>
        <div class="stadium-info">Duhok Stadium 📍</div>
    </div>

    <!-- Match 2 -->
    <div class="match-card">
        <div class="match-header"><span>ROUND (34)</span><span>2026/05/10</span></div>
        <div class="teams-row">
            <div class="team-box left"><span>AL QASIM</span><img src="https://upload.wikimedia.org/wikipedia/en/4/41/Al-Qasim_SC_logo.png" class="team-logo"></div>
            <div class="vs-text">VS</div>
            <div class="team-box right"><span>DUHOK</span><img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="team-logo"></div>
        </div>
        <div class="stadium-info">Duhok Stadium 📍</div>
    </div>

</div>

</body>
</html>
