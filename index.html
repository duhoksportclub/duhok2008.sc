<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; width: 100vw;
        }

        .header {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            position: relative;
            background: linear-gradient(to bottom, rgba(5, 10, 20, 0.3), #050a14), 
                        url('https://pbs.twimg.com/media/GrGVejLWUAAiwNv.jpg') left center / 50% 100% no-repeat,
                        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTu9KzknhiVsImceIPQNnBd7YmAWl7HFO_-IEQFSnFY1w&s') right center / 50% 100% no-repeat;
            background-color: #0a1428;
        }

        .side-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 45px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8), 2px 2px 5px #000;
            z-index: 5;
        }

        .header h1 { 
            z-index: 5; margin: 0; color: #d4af37; font-size: 18px; font-weight: 900;
            text-align: center; text-shadow: 2px 2px 10px #000; line-height: 1.1;
        }

        .nav-tabs { 
            display: flex; width: 100%; background: #0a1428; 
            border-bottom: 1px solid #d4af37; position: sticky; top: 0; z-index: 10; 
        }
        
        .tab-btn { flex: 1; padding: 15px 5px; color: #d4af37; background: none; border: none; font-weight: bold; font-size: 10px; text-transform: uppercase; }
        .tab-btn.active { border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.1); color: #fff; }

        .container { width: 100%; max-width: 450px; padding: 20px 15px; box-sizing: border-box; }
        
        .match-card { 
            border: 2px solid #d4af37; 
            border-radius: 25px; 
            padding: 20px 10px; 
            background: rgba(10, 20, 40, 0.6); 
            margin-bottom: 20px; 
        }

        .teams-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
        .team-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        .logo-img { 
            width: 65px; height: 65px; border-radius: 50%; 
            border: 1px solid #d4af37; background: #fff; padding: 2px;
            object-fit: contain;
        }

        .vs-text { font-size: 35px; font-weight: 900; color: #d4af37; }
        .team-name { font-weight: 800; font-size: 11px; color: #fff; margin-top: 10px; text-align: center; }
        
        .match-status { text-align:center; font-size:10px; font-weight: bold; color: #ff4d4d; margin-bottom: 10px; letter-spacing: 1px; }
        .league-label { text-align:center; margin-top:15px; font-size:13px; font-weight:bold; color: #d4af37; padding-top: 10px; }
        .match-date { text-align:center; font-size:11px; color: #aaa; margin-top: 5px; font-weight: bold; }

        .tiktok-btn { display: flex; align-items: center; justify-content: center; width: 85%; margin: 20px auto; background: #000; color: #fff; padding: 12px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid #fff; }
    </style>
</head>
<body>

<div class="header">
    <div class="side-font">93</div>
    <h1>DUHOK<br>SPORT CLUB</h1>
    <div class="side-font">34</div>
</div>

<div class="nav-tabs">
    <button class="tab-btn">COMMUNITY</button>
    <button class="tab-btn">SQUAD</button>
    <button class="tab-btn">VIDEOS</button>
    <button class="tab-btn active">MATCHES</button>
</div>

<div class="container">
    
    <div class="match-card">
        <div class="match-status">GULF SUPER CUP</div>
        <div class="teams-row">
            <!-- ئەلڕەیان ل لایێ ڕاستێ -->
            <div class="team-box">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiz6K7u973g6Z0D7_DclWp6j-S4ZlYwLgS-Qd_4-l9H-n6Bby0V7p2vB86MWhvO0_F-i9YmAWl7HFO_-IEQFSnFY1w/s1600/Al-Rayyan_SC_logo.png" class="logo-img">
                <div class="team-name">AL RAYYAN</div>
            </div>
            
            <div class="vs-text">VS</div>
            
            <!-- دهۆک ل لایێ چەپێ دگەل لۆگۆیێ نوو یێ د وێنەیێ image_5.png دا -->
            <div class="team-box">
                <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEghf96Z4Yw2b-4K5g5V-vLwLoxk_Pcl38j7y6L-F-yY8f6r9g8vP7m_K86MW_F-i9YmAWl7HFO_-IEQFSnFY1w/s1600/Duhok_New_Logo.png" class="logo-img">
                <div class="team-name">DUHOK SC</div>
            </div>
        </div>
        <div class="league-label">CHAMPIONSHIP MATCH</div>
        <div class="match-date">13 / 08 / 2026</div>
    </div>

    <a href="https://www.tiktok.com/@duhok2008.sc" target="_blank" class="tiktok-btn">FOLLOW ON TIKTOK</a>
</div>

</body>
</html>
