<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; width: 100vw; position: fixed; height: 100%;
        }

        /* سەرێ لاپەرەی - بەروەژ کرى */
        .header {
            width: 100%;
            height: 160px;
            background-color: #050a14;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            position: relative;
            overflow: hidden;
        }

        .header-bg-img {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            z-index: 1;
            filter: grayscale(30%);
        }

        .side-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff; /* نوکە ڕەنگێ سپی یێ گەش دا جودا بیت */
            text-shadow: 0 0 20px #d4af37;
            z-index: 2;
        }

        .header h1 { 
            z-index: 2;
            margin: 0; 
            color: #d4af37; /* ڕەنگێ ناڤى بوو زێرى */
            font-size: 18px; 
            font-weight: 900; 
            text-align: center;
            line-height: 1.2;
            text-shadow: 2px 2px 8px #000;
        }

        .nav-tabs {
            display: flex; width: 100%; background: #0a1428; border-bottom: 1px solid #d4af37; z-index: 3;
        }
        .tab-btn {
            flex: 1; padding: 12px 5px; color: #d4af37; background: none; border: none;
            font-weight: bold; cursor: pointer; font-size: 11px; text-transform: uppercase;
        }
        .tab-btn.active { border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.1); }

        .container {
            width: 100%; max-width: 450px; padding: 20px 15px; box-sizing: border-box;
            overflow-y: auto; height: calc(100vh - 210px);
        }

        .match-card {
            border: 1px solid #d4af37; border-radius: 25px; padding: 25px 10px;
            background: rgba(10, 20, 40, 0.7); margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .teams-row { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; }
        .logo-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #d4af37; background: white; }
        .vs-text { font-size: 35px; font-weight: 900; font-style: italic; color: #d4af37; }
        .team-name { font-weight: bold; font-size: 12px; color: #fff; margin-top: 5px; }

        .tiktok-btn {
            display: flex; align-items: center; justify-content: center;
            width: 85%; margin: 10px auto; background: #000; color: #fff;
            padding: 12px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid #fff;
        }

        .coming-soon-section { text-align: center; padding: 60px 20px; opacity: 0.3; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <!-- وێنێ باکگراوند -->
    <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1000&auto=format&fit=crop" class="header-bg-img">
    
    <!-- هژمار لایێ چەپێ (بەروەژ) -->
    <div class="side-font">34</div>
    
    <h1>DUHOK<br>SPORT CLUB</h1>
    
    <!-- هژمار لایێ ڕاستێ (بەروەژ) -->
    <div class="side-font">93</div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" id="mBtn" onclick="show('matches')">MATCHES</button>
    <button class="tab-btn" id="vBtn" onclick="show('videos')">VIDEOS</button>
    <button class="tab-btn" id="sBtn" onclick="show('squad')">SQUAD</button>
    <button class="tab-btn" id="cBtn" onclick="show('chat')">COMMUNITY</button>
</div>

<div class="container" id="matches-area">
    <div class="match-card">
        <div style="text-align:center; font-size:11px; margin-bottom:15px; color: #aaa;">ROUND (33) | 2026/05/05</div>
        <div class="teams-row">
            <div style="text-align: center;">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="logo-img">
                <div class="team-name">NAFT MISSAN</div>
            </div>
            <div class="vs-text">VS</div>
            <div style="text-align: center;">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="logo-img">
                <div class="team-name">DUHOK</div>
            </div>
        </div>
        <div style="text-align:center; margin-top:20px; font-size:12px; color: #d4af37;">DUHOK STADIUM 📍</div>
    </div>
    <a href="https://www.tiktok.com/@duhok2008.sc" target="_blank" class="tiktok-btn">FOLLOW ON TIKTOK</a>
</div>

<div class="container hidden" id="videos-area">
    <div class="coming-soon-section"><h1>COMING SOON</h1></div>
</div>
<div class="container hidden" id="squad-area">
    <div class="coming-soon-section"><h1>COMING SOON</h1></div>
</div>
<div class="container hidden" id="chat-area">
    <div class="coming-soon-section"><h1>COMING SOON</h1></div>
</div>

<script>
    function show(type) {
        const areas = ['matches-area', 'videos-area', 'squad-area', 'chat-area'];
        const btns = ['mBtn', 'vBtn', 'sBtn', 'cBtn'];
        areas.forEach(a => document.getElementById(a).classList.add('hidden'));
        btns.forEach(b => document.getElementById(b).classList.remove('active'));
        document.getElementById(type + '-area').classList.remove('hidden');
        document.getElementById(type.charAt(0) + 'Btn').classList.add('active');
    }
</script>

</body>
</html>
