<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaneya Dihokê ya Werzişî | Duhok SC</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --yellow: #FFD700;
            --blue: #0f2042;
            --light-blue: #1e3a6d;
            --white: #ffffff;
            --gray: #f4f4f4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--blue);
            color: var(--white);
            text-align: center;
        }

        /* Header / Serûpela Malperê */
        header {
            background: linear-gradient(135deg, var(--blue), var(--light-blue));
            padding: 30px 20px;
            border-bottom: 4px solid var(--yellow);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .logo {
            width: 100px;
            height: 100px;
            background-color: var(--yellow);
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--blue);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
        }

        header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: var(--yellow);
        }

        header p {
            font-size: 14px;
            opacity: 0.8;
        }

        /* Navenda Bişkokan (Buttons) */
        .links-container {
            max-width: 500px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .main-btn {
            background: linear-gradient(90deg, var(--light-blue), #254b8c);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }

        .main-btn:hover {
            border-color: var(--yellow);
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(255, 215, 0, 0.2);
            background: var(--yellow);
            color: var(--blue);
        }

        .main-btn i {
            font-size: 20px;
        }

        /* Beşê Lîstik û Yariyan */
        .match-section {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 18px;
            color: var(--yellow);
            margin-bottom: 15px;
            text-align: right;
            border-right: 3px solid var(--yellow);
            padding-right: 10px;
        }

        .match-card {
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .team {
            flex: 1;
            font-weight: bold;
        }

        .vs {
            background-color: var(--yellow);
            color: var(--blue);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin: 0 10px;
        }

        /* Footer */
        footer {
            margin-top: 5px;
            padding: 20px;
            font-size: 12px;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fas fa-trophy"></i>
        </div>
        <h1>Duhok Sport Club</h1>
        <p>Yaneya Çiyayan - Malpera Fermî ya Yariyan</p>
    </header>

    <div class="links-container">
        
        <a href="https://www.facebook.com/" target="_blank" class="main-btn">
            <i class="fab fa-facebook"></i>
            <span>Rûpela Facebookê</span>
            <i class="fas fa-chevron-left"></i>
        </a>

        <a href="https://www.instagram.com/" target="_blank" class="main-btn">
            <i class="fab fa-instagram"></i>
            <span>Hesabê Instagramê</span>
            <i class="fas fa-chevron-left"></i>
        </a>

        <a href="#" class="main-btn">
            <i class="fas fa-tv"></i>
            <span>Weşana Zindî (Live)</span>
            <i class="fas fa-chevron-left"></i>
        </a>

        <a href="#" class="main-btn">
            <i class="fas fa-calendar-alt"></i>
            <span>Xula Iraqê / Cedwel</span>
            <i class="fas fa-chevron-left"></i>
        </a>

    </div>

    <div class="match-section">
        <div class="section-title">Yariyên Hatî Medandin / Yên Paşerojê</div>
        
        <div class="match-card">
            <div class="team">Duhok SC</div>
            <span class="vs">VS</span>
            <div class="team">Zaxho SC</div>
        </div>

        <div class="match-card">
            <div class="team">Erbil SC</div>
            <span class="vs">VS</span>
            <div class="team">Duhok SC</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Duhok SC Fan Page. All Rights Reserved.</p>
    </footer>

</body>
</html>
