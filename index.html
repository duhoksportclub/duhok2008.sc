<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: 'Arial', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; width: 100vw; position: fixed; height: 100%;
        }

        .header {
            width: 100%;
            height: 160px;
            background-color: #0b1629;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            position: relative;
        }

        /* لێرە من قەبارێ هژماران و جهێ وان باشتر کر */
        .side-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 35px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #d4af37;
            z-index: 5;
            min-width: 60px;
            text-align: center;
        }

        .header h1 { 
            z-index: 5;
            margin: 0; 
            color: #d4af37;
            font-size: 20px; 
            font-weight: bold;
            text-align: center;
        }

        .nav-tabs {
            display: flex; width: 100%; background: #0a1428; border-bottom: 1px solid #d4af37;
        }
        .tab-btn {
            flex: 1; padding: 15px 5px; color: #d4af37; background: none; border: none;
            font-weight: bold; cursor: pointer; font-size: 11px;
        }
        .tab-btn.active { border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.1); }

        .container {
            width: 100%; max-width: 450px; padding: 20px 15px; box-sizing: border-box;
            overflow-y: auto; height: calc(100vh - 210px);
        }

        .match-card {
            border: 2px solid #d4af37; border-radius: 20px; padding: 20px 10px;
            background: rgba(10, 20, 40, 0.9); margin-bottom: 20px;
        }

        /* چاکسازیا جهێ لوگۆ و ناڤان */
        .teams-row { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            width: 100%;
        }
        
        .team-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-img { 
            width: 60px; 
            height: 60px; 
            border-radius: 50%; 
            border: 2px solid #d4af37; 
            background: white;
            object-fit: contain; /* دا وێنە نەشکێت */
        }

        .vs-text { font-size: 30px; font-weight: 900; font-style: italic; color: #d4af37; padding: 0 10px; }
        .team-name { font-weight: bold; font-size: 12px; color: #fff; margin-top: 8px; white-space: nowrap; }

        .tiktok-btn {
            display: flex; align-items: center; justify-content: center;
            width: 80%; margin: 10px auto; background: #000; color: #fff;
            padding: 12px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid #fff;
        }

        .coming-soon { text-align: center; padding: 50px; opacity: 0.3; font-size: 25px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header">
    <div class="side-font">34</div>
    <h1>DUHOK<br>SPORT CLUB</h1>
    <div class="side-font">93</div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" id="mBtn" onclick="show('matches')">MATCHES</button>
    <button class="tab-btn" id="vBtn" onclick="show('videos')">VIDEOS</button>
    <button class="tab-btn" id="sBtn" onclick="show('squad')">SQUAD</button>
    <button class="tab-btn" id="cBtn" onclick="show('chat')">COMMUNITY</button>
</div>

<div class="container" id="matches-area">
    <div class="match-card">
        <div style="text-align:center; font-size:11px; margin-bottom:15px; color: #aaa;">ROUND (33) | 2026/05/05</div>
        <div class="teams-row">
            <div class="team-box">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="logo-img">
                <div class="team-name">NAFT MISSAN</div>
            </div>
            
            <div class="vs-text">VS</div>

            <div class="team-box">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="logo-img">
                <div class="team-name">DUHOK</div>
            </div>
        </div>
    </div>
    <a href="https://www.tiktok.com/@duhok2008.sc" target="_blank" class="tiktok-btn">FOLLOW ON TIKTOK</a>
</div>

<div class="container hidden" id="videos-area"><div class="coming-soon">COMING SOON</div></div>
<div class="container hidden" id="squad-area"><div class="coming-soon">COMING SOON</div></div>
<div class="container hidden" id="chat-area"><div class="coming-soon">COMING SOON</div></div>

<script>
    function show(type) {
        const areas = ['matches-area', 'videos-area', 'squad-area', 'chat-area'];
        const btns = ['mBtn', 'vBtn', 'sBtn', 'cBtn'];
        areas.forEach(a => document.getElementById(a).classList.add('hidden'));
        btns.forEach(b => document.getElementById(b).classList.remove('active'));
        document.getElementById(type + '-area').classList.remove('hidden');
        document.getElementById(type.charAt(0) + 'Btn').classList.add('active');
    }
</script>

</body>
</html>
