<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; width: 100vw; position: fixed; height: 100%;
        }

        /* لێرە من وێنێ تە کرە باکگراوند */
        .header {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            position: relative;
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.3), #050a14), 
                              url('https://raw.githubusercontent.com/your-username/your-repo/main/image.png'); /* تێبینی ل خوارێ بخوینە */
            background-size: cover;
            background-position: center;
        }

        /* فۆنتێ هژماران */
        .side-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px #d4af37, 2px 2px 5px #000;
            z-index: 5;
        }

        .header h1 { 
            z-index: 5;
            margin: 0; 
            color: #d4af37;
            font-size: 22px; 
            font-weight: 900;
            text-align: center;
            text-shadow: 2px 2px 10px #000;
            line-height: 1.1;
        }

        .nav-tabs {
            display: flex; width: 100%; background: #0a1428; border-bottom: 1px solid #d4af37; z-index: 10;
        }
        .tab-btn {
            flex: 1; padding: 15px 5px; color: #d4af37; background: none; border: none;
            font-weight: bold; cursor: pointer; font-size: 11px;
        }
        .tab-btn.active { border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.1); }

        .container {
            width: 100%; max-width: 450px; padding: 20px 15px; box-sizing: border-box;
            overflow-y: auto; height: calc(100vh - 230px);
        }

        .match-card {
            border: 2px solid #d4af37; border-radius: 20px; padding: 25px 10px;
            background: rgba(10, 20, 40, 0.85); margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .teams-row { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .team-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        .logo-img { width: 65px; height: 65px; border-radius: 50%; border: 2px solid #d4af37; background: white; object-fit: contain; }
        .vs-text { font-size: 32px; font-weight: 900; font-style: italic; color: #d4af37; }
        .team-name { font-weight: bold; font-size: 12px; color: #fff; margin-top: 10px; text-align: center; }

        .tiktok-btn {
            display: flex; align-items: center; justify-content: center;
            width: 85%; margin: 15px auto; background: #000; color: #fff;
            padding: 12px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid #fff;
        }

        .coming-soon { text-align: center; padding: 60px; opacity: 0.2; font-size: 28px; font-weight: 900; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="header" id="myHeader">
    <div class="side-font">34</div>
    <h1>DUHOK<br>SPORT CLUB</h1>
    <div class="side-font">93</div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" id="mBtn" onclick="show('matches')">MATCHES</button>
    <button class="tab-btn" id="vBtn" onclick="show('videos')">VIDEOS</button>
    <button class="tab-btn" id="sBtn" onclick="show('squad')">SQUAD</button>
    <button class="tab-btn" id="cBtn" onclick="show('chat')">COMMUNITY</button>
</div>

<div class="container" id="matches-area">
    <div class="match-card">
        <div style="text-align:center; font-size:11px; margin-bottom:15px; color: #ccc;">ROUND (33) | 2026/05/05</div>
        <div class="teams-row">
            <div class="team-box">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="logo-img">
                <div class="team-name">NAFT MISSAN</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="team-box">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="logo-img">
                <div class="team-name">DUHOK</div>
            </div>
        </div>
        <div style="text-align:center; margin-top:20px; font-size:11px; color: #d4af37;">STADIUM: DUHOK 🏟️</div>
    </div>
    <a href="https://www.tiktok.com/@duhok2008.sc" target="_blank" class="tiktok-btn">FOLLOW ON TIKTOK</a>
</div>

<div class="container hidden" id="videos-area"><div class="coming-soon">COMING SOON</div></div>
<div class="container hidden" id="squad-area"><div class="coming-soon">COMING SOON</div></div>
<div class="container hidden" id="chat-area"><div class="coming-soon">COMING SOON</div></div>

<script>
    function show(type) {
        const areas = ['matches-area', 'videos-area', 'squad-area', 'chat-area'];
        const btns = ['mBtn', 'vBtn', 'sBtn', 'cBtn'];
        areas.forEach(a => document.getElementById(a).classList.add('hidden'));
        btns.forEach(b => document.getElementById(b).classList.remove('active'));
        document.getElementById(type + '-area').classList.remove('hidden');
        document.getElementById(type.charAt(0) + 'Btn').classList.add('active');
    }

    // لۆژیکەکێ سادە بۆ دانانا وێنێ تە ئەگەر د فایلەکێ دا بیت
    // دڤێت وێنێ تە ل سەر ئینتەرنێتێ بیت دا کو لێرە کار بکەت
    document.getElementById('myHeader').style.backgroundImage = "linear-gradient(to bottom, rgba(5, 10, 20, 0.3), #050a14), url('https://i.ibb.co/LzdYpS7/duhok-stadium.jpg')";
</script>

</body>
</html>
