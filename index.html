<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');

        body {
            background-color: #050a14;
            color: #d4af37;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; width: 100vw; position: fixed; height: 100%;
        }

        .header {
            width: 100%;
            height: 180px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-bottom: 2px solid #d4af37;
            position: relative;
            /* لێرە من هەردوو وێنە پێکڤە دانا وەک تێکەل (Overlay) */
            background: linear-gradient(to bottom, rgba(5, 10, 20, 0.4), #050a14), 
                        url('https://pbs.twimg.com/media/GrGVejLWUAAiwNv.jpg') left center no-repeat,
                        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTu9KzknhiVsImceIPQNnBd7YmAWl7HFO_-IEQFSnFY1w&s') right center no-repeat;
            background-size: contain, 50% 100%, 50% 100%;
            background-color: #0a1428;
        }

        .side-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 38px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px #d4af37, 2px 2px 5px #000;
            z-index: 5;
        }

        .header h1 { 
            z-index: 5; margin: 0; color: #d4af37; font-size: 19px; font-weight: 900;
            text-align: center; text-shadow: 2px 2px 10px #000; line-height: 1.2;
        }

        .nav-tabs { display: flex; width: 100%; background: #0a1428; border-bottom: 1px solid #d4af37; }
        .tab-btn { flex: 1; padding: 15px 5px; color: #d4af37; background: none; border: none; font-weight: bold; font-size: 11px; }
        .tab-btn.active { border-bottom: 3px solid #d4af37; background: rgba(212, 175, 55, 0.1); }

        .container { width: 100%; max-width: 450px; padding: 20px 15px; box-sizing: border-box; overflow-y: auto; height: calc(100vh - 230px); }
        .match-card { border: 2px solid #d4af37; border-radius: 20px; padding: 25px 10px; background: rgba(10, 20, 40, 0.9); margin-bottom: 20px; }
        .teams-row { display: flex; align-items: center; justify-content: space-between; }
        .team-box { flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        .logo-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid #d4af37; background: #fff; padding: 2px; }
        .vs-text { font-size: 32px; font-weight: 900; color: #d4af37; }
        .team-name { font-weight: bold; font-size: 12px; color: #fff; margin-top: 10px; }

        .tiktok-btn { display: flex; align-items: center; justify-content: center; width: 85%; margin: 15px auto; background: #000; color: #fff; padding: 12px; border-radius: 50px; text-decoration: none; font-weight: bold; border: 1px solid #fff; }
    </style>
</head>
<body>

<div class="header">
    <!-- هژمار: 34 ل چەپێ و 93 ل ڕاستێ -->
    <div class="side-font">34</div>
    <h1>DUHOK<br>SPORT CLUB</h1>
    <div class="side-font">93</div>
</div>

<div class="nav-tabs">
    <button class="tab-btn active">MATCHES</button>
    <button class="tab-btn">VIDEOS</button>
    <button class="tab-btn">SQUAD</button>
    <button class="tab-btn">COMMUNITY</button>
</div>

<div class="container">
    <div class="match-card">
        <div style="text-align:center; font-size:11px; margin-bottom:15px; color: #aaa;">ROUND (33) | 2026/05/05</div>
        <div class="teams-row">
            <div class="team-box">
                <img src="https://upload.wikimedia.org/wikipedia/en/c/c5/Duhok_SC_logo.png" class="logo-img">
                <div class="team-name">DUHOK</div>
            </div>
            <div class="vs-text">VS</div>
            <div class="team-box">
                <img src="https://upload.wikimedia.org/wikipedia/en/3/3a/Naft_Maysan_logo.png" class="logo-img">
                <div class="team-name">NAFT MISSAN</div>
            </div>
        </div>
        <div style="text-align:center; margin-top:15px; font-size:11px; color: #d4af37;">Iraq Cup & Gulf Cup 🏆</div>
    </div>
    <a href="https://www.tiktok.com/@duhok2008.sc" target="_blank" class="tiktok-btn">FOLLOW ON TIKTOK</a>
</div>

</body>
</html>
